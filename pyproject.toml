[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-biography"
version = "0.2.1"
description = "Offline Russian interview research prototype"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.8,<3", "psutil>=6,<8", "python-docx>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
gui = ["PySide6>=6.8,<6.9"]
prepare = ["piper-tts>=1.8,<2", "onnx>=1.17,<2"]
asr = ["faster-whisper>=1.1,<2", "av>=11,<17"]
diarization = ["pyannote.audio>=3.3,<4"]
onnx-diarization = ["sherpa-onnx>=1.12,<3"]
llm = ["llama-cpp-python>=0.3,<0.4"]

[project.scripts]
biography = "biography.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
biography = ["resources/*.json"]
