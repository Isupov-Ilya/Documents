name: Installed Windows EXE - one hour offline stability
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tested installer release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  hour:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation tools only
        run: python -m pip install -e ".[test]"
      - name: Download the already tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download $env:RELEASE_TAG --pattern Biography-Setup-Windows-x64.exe --dir downloaded
      - name: Install and create the test profile
        run: |
          $install=Join-Path $env:RUNNER_TEMP 'Биография часовая проверка'
          $setup=(Resolve-Path downloaded/Biography-Setup-Windows-x64.exe).Path
          $p=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$install+'"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installation failed' }
          $data=Join-Path $env:RUNNER_TEMP 'Часовые данные'
          python scripts/prepare_test_profile.py --data-directory $data
      - name: Process a real one-hour audio file with no application network
        run: |
          $exe=Join-Path $env:RUNNER_TEMP 'Биография часовая проверка/Biography.exe'
          $data=Join-Path $env:RUNNER_TEMP 'Часовые данные'
          ./scripts/windows_offline_test.ps1 -Exe $exe -DataDirectory $data -DurationSeconds 3600
      - name: Preserve synthetic project evidence even after a failed check
        if: always()
        run: |
          $data=Join-Path $env:RUNNER_TEMP 'Часовые данные'
          $evidence=Join-Path $PWD 'dist/validation/projects'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          if (Test-Path $data) {
            Get-ChildItem -LiteralPath $data -Filter quality_report.json -Recurse | ForEach-Object {
              $project=$_.Directory.FullName
              $target=Join-Path $evidence $_.Directory.Name
              New-Item -ItemType Directory -Path $target -Force | Out-Null
              Get-ChildItem -LiteralPath $project -File | Where-Object { $_.Extension -in @('.json','.docx') } | Copy-Item -Destination $target
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-one-hour-validation
          path: dist/validation
          retention-days: 30
      - name: Attach passed evidence to the installer release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          Compress-Archive -Path dist/validation/* -DestinationPath dist/Windows-one-hour-validation.zip
          gh release upload $env:RELEASE_TAG dist/Windows-one-hour-validation.zip
