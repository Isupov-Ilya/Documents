name: Windows product build and offline validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CUDA=OFF'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install CPU application and build dependencies
        run: python -m pip install -e ".[test,asr,onnx-diarization,llm]" PySide6==6.8.3 python-docx==1.2.0 pyinstaller==6.16.0
      - name: Run application tests
        run: python -m pytest -q
      - name: Build Windows executable
        run: python scripts/build_windows.py
      - name: Exercise frozen executable
        run: |
          & dist/Biography/Biography.exe demo --fixtures examples --output dist/frozen-demo
          if ($LASTEXITCODE -ne 0) { throw 'Frozen smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Biography-Windows-build
          path: |
            dist/Biography
            dist/frozen-demo
          retention-days: 14
