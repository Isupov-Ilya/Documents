name: Publish an already tested Windows installer
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Windows build run with a passed offline test
        required: true
        type: string
      release_tag:
        description: Existing Git tag pointing to the tested build commit
        required: true
        type: string
      installer_sha256:
        description: Expected installer SHA-256
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          name: Biography-Windows-build-and-validation
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: build-output
      - name: Verify evidence and publish the exact installer
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_SHA: ${{ inputs.installer_sha256 }}
        run: |
          build_commit=$(gh run view "$BUILD_RUN" --json headSha --jq .headSha)
          test "$build_commit" = "$(git rev-parse HEAD)"
          jq -e '.status == "passed" and .actual_models and .document_count == 3' build-output/validation/offline-test.json
          jq -e '.outbound_firewall_block_verified and .source_audio_unchanged' build-output/validation/firewall-proof.json
          printf '%s  %s\n' "$INSTALLER_SHA" build-output/installer/Biography-Setup-Windows-x64.exe | sha256sum -c -
          mkdir -p release
          cp build-output/installer/Biography-Setup-Windows-x64.exe release/
          cp build-output/validation/native-windows-gui.png release/Interface.png
          (cd build-output/validation && zip -q -r ../../release/Windows-validation.zip .)
          (cd release && sha256sum Biography-Setup-Windows-x64.exe Windows-validation.zip Interface.png > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release/Biography-Setup-Windows-x64.exe release/Windows-validation.zip release/Interface.png release/SHA256SUMS.txt --verify-tag --prerelease --title 'Биография 0.2.2 для Windows' --notes-file packaging/RELEASE-NOTES.ru.md
